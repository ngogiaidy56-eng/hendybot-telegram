name: Test source and set up Hendy Telegram Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendybot-telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate source and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build Worker bundle (dry run)
        run: npm run build

  deploy-and-activate:
    name: Deploy Worker, configure secrets and activate webhook
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: ${{ vars.WORKER_URL || 'https://hendybot-telegram.ngogiaidy56.workers.dev' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check required GitHub secrets
        shell: bash
        run: |
          missing=()
          [[ -n "$BOT_TOKEN" ]] || missing+=("BOT_TOKEN (new token from @BotFather)")
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository Actions secrets: ${missing[*]}"
            echo "Open Settings > Secrets and variables > Actions and add the listed secrets."
            exit 1
          fi

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy Worker, configure secrets and activate webhook
        run: npm run setup
