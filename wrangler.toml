[vars]
ADMIN_ID = "8639286417"
MINI_APP_URL = "https://ngogiaidy56-eng.github.io/BOT-TELE"

# Configure secrets with:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put WEBHOOK_SECRET_TOKEN
# npx wrangler secret put WEBHOOK_SETUP_KEY
#
# Optional:
# npx wrangler secret put CORE_BACKEND_URL
# npx wrangler secret put DEPOSIT_INFO
# npx wrangler secret put WEB_APP_URL
#
# Persistent user/state storage (recommended for production):
# 1. npx wrangler kv namespace create HENDY_KV
# 2. Uncomment the block below and replace the ID with the returned namespace ID.
# [[kv_namespaces]]
# binding = "HENDY_KV"
# id = "PASTE_KV_NAMESPACE_ID_HERE"
